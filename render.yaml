databases:
  - name: sr-action-hub-db
    databaseName: sr_action_hub
    user: sraction
    plan: free

services:
  - type: web
    name: sr-action-hub
    runtime: node
    plan: free
    buildCommand: "cd frontend && NODE_ENV=development npm ci && npm run build && cd ../backend && NODE_ENV=development npm ci && npx prisma generate && npm run build"
    startCommand: "cd backend && npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/server.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sr-action-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Completion emails via Outlook/Microsoft 365 SMTP. Set these manually
      # in the Render dashboard once you have a mailbox + app password —
      # nothing sends until SMTP_USER/SMTP_PASS are filled in.
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: SR Accounting
