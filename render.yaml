databases:
  - name: sr-action-hub-db
    databaseName: sr_action_hub
    user: sraction
    plan: free

services:
  - type: web
    name: sr-action-hub
    runtime: node
    plan: free
    buildCommand: "cd frontend && NODE_ENV=development npm ci && npm run build && cd ../backend && NODE_ENV=development npm ci && npx prisma generate && npm run build"
    startCommand: "cd backend && npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/server.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sr-action-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Ticket emails via Microsoft Graph, sent/read as the fixed
      # ticketing@sraccounting.co.za shared mailbox — see README.md
      # "Email via Microsoft Graph". Certificate-based app-only auth only.
      # The four MS_* identifiers below are non-secret and can be set from
      # GRAPH_CONFIGURATION.md; nothing sends until they're all filled in.
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_SHARED_MAILBOX
        value: ticketing@sraccounting.co.za
      - key: MS_CERTIFICATE_THUMBPRINT
        sync: false
      # The private key itself is never a plain env var. Upload it as a
      # Render "Secret File" (Dashboard → this service → Environment →
      # Secret Files), then set this to whatever path Render mounts it at.
      - key: MS_CERTIFICATE_PRIVATE_KEY_PATH
        sync: false
      - key: MAIL_FROM_NAME
        value: SR Accounting
