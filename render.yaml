databases:
  - name: sr-action-hub-db
    databaseName: sr_action_hub
    user: sraction
    plan: free

services:
  - type: web
    name: sr-action-hub
    runtime: node
    plan: free
    buildCommand: "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev && npx prisma generate && npm run build"
    startCommand: "cd backend && npx prisma migrate deploy && node dist/server.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sr-action-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
