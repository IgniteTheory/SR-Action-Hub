databases:
  - name: sr-action-hub-db
    databaseName: sr_action_hub
    user: sraction

services:
  - type: web
    name: sr-action-hub
    runtime: node
    plan: free
    rootDir: .
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && npm install && npx prisma generate && npm run build"
    startCommand: "cd backend && npx prisma migrate deploy && node dist/server.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sr-action-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
